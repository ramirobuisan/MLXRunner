name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check engines.json and model-profiles.json
        run: |
          python3 - <<'PY'
          import json
          specs = json.load(open("MLXRunner/Resources/engines.json"))
          ids = [s["id"] for s in specs]
          assert len(ids) == len(set(ids)), "duplicate engine ids"
          for s in specs:
              for key in ("id", "name", "repo", "summary", "install", "command"):
                  assert key in s, f"{s.get('id', '?')}: missing {key}"
              assert s["install"]["kind"] in ("uv", "brew", "external"), f"{s['id']}: unknown install kind"
          print(f"{len(ids)} engines OK")

          profiles = json.load(open("MLXRunner/Resources/model-profiles.json"))
          pids = [p["id"] for p in profiles]
          assert len(pids) == len(set(pids)), "duplicate profile ids"
          engine_ids = set(ids)
          for p in profiles:
              assert p.get("repos") or p.get("nameContains") or p.get("modelTypes"), f"{p['id']}: matches nothing"
              assert p.get("source", "").startswith("https://"), f"{p['id']}: needs a source link"
              for e in list(p.get("engines", {})) + p.get("onlyEngines", []):
                  assert e in engine_ids, f"{p['id']}: unknown engine {e}"
          print(f"{len(pids)} model profiles OK")
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project MLXRunner.xcodeproj -scheme MLXRunner -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- build
